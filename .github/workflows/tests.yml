name: Tests

on: [push, pull_request]

env:
  DEFAULT_COMPOSER_FLAGS: "--no-interaction"
jobs:
  ## PHPSTAN
  phpstan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install PHP
        uses: shivammathur/setup-php@2.37.1
        with:
          php-version: '8.0'
          extensions: mbstring, intl
          coverage: none
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          update: true

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: PHPStan tests
        run: composer phpstan

  ## Rector
  rector:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install PHP
        uses: shivammathur/setup-php@2.37.1
        with:
          php-version: '8.0'
          extensions: mbstring, intl
          coverage: none
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          update: true

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Rector tests
        run: composer rector

      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Apply rector changes
        
  php-cs-fixer:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@v3

        ## php-cs-fixer only supports php 8.1 and below, therefore the php version
        ## can not be the default version of the runner image.
        - name: Install PHP
          uses: shivammathur/setup-php@2.37.1
          with:
            php-version: '8.0'
            extensions: mbstring, intl
            coverage: none
          env:
            COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        - name: Install
          run: composer install

        - name: Run php-cs-fixer
          run: composer phpcsfixer

        - uses: stefanzweifel/git-auto-commit-action@v4
          with:
              commit_message: Apply php-cs-fixer changes

  ## PHPUNIT
  phpunit:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      ## checkout the repoistory 
      - name: Checkout Repo
        uses: actions/checkout@v3

      ## Install(?) php
      - name: Install PHP
        uses: shivammathur/setup-php@2.37.1
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, mcrypt, zip
          ini-values: date.timezone='UTC'
          tools: composer:v2
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      ## install composer
      ## clear cache issue: https://github.com/composer/composer/issues/5982
      - name: Install dependencies
        run: composer clearcache && composer install --prefer-dist

      ## run unit tests
      - name: PHP Unit tests for PHP 
        run: vendor/bin/phpunit --verbose --configuration actions.phpunit.xml
        if: matrix.php != '8.4'

      ## unit test with coverage, on a supported php version
      - name: PHP Unit tests with coverage
        run: vendor/bin/phpunit --verbose --coverage-clover=clover.xml --configuration actions.phpunit.xml
        if: matrix.php == '8.4'

      ## coverage summary in the GitHub job summary, no 3rd party service needed
      - name: Coverage summary
        run: |
          php -r '$m = simplexml_load_file("clover.xml")->project->metrics;
          $pct = function ($c, $t) { return $t > 0 ? round($c / $t * 100, 2) : 100; };
          echo "### Code coverage\n\n| Metric | Covered | Total | % |\n|---|---|---|---|\n";
          echo "| Lines | {$m["coveredstatements"]} | {$m["statements"]} | " . $pct((int) $m["coveredstatements"], (int) $m["statements"]) . " |\n";
          echo "| Methods | {$m["coveredmethods"]} | {$m["methods"]} | " . $pct((int) $m["coveredmethods"], (int) $m["methods"]) . " |\n";' >> $GITHUB_STEP_SUMMARY
        if: matrix.php == '8.4'

      ## coverage upload to qlty.sh (successor of Code Climate)
      - name: Upload coverage to Qlty
        uses: qltysh/qlty-action/coverage@v2
        with:
          oidc: true
          files: clover.xml
        if: matrix.php == '8.4' && github.event_name == 'push'
        continue-on-error: true
